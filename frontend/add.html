<!DOCTYPE html>
<html>
<head>
    <title>Add Employee - Info System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="main-title">Add New Employee</h1>

    <div class="nav-container">
        <a href="index.html" class="btn-nav">DASHBOARD</a>
        <a href="employees.html" class="btn-nav">EMPLOYEES</a>
        <a href="#" id="logoutBtn" class="btn-nav" style="float: right;">LOGOUT</a>
    </div>

    <div class="login-container" style="max-width: 500px;">
        <form id="addEmployeeForm" class="login-form">
            <div class="form-group">
                <label style="color: rgba(255,255,255,0.6); margin-bottom: 8px; display: block; font-size: 14px; letter-spacing: 1px;">FIRST NAME</label>
                <input type="text" id="first_name" required class="form-control">
            </div>
            <div class="form-group">
                <label style="color: rgba(255,255,255,0.6); margin-bottom: 8px; display: block; font-size: 14px; letter-spacing: 1px;">LAST NAME</label>
                <input type="text" id="last_name" required class="form-control">
            </div>
            <div class="form-group">
                <label style="color: rgba(255,255,255,0.6); margin-bottom: 8px; display: block; font-size: 14px; letter-spacing: 1px;">STATUS</label>
                <select id="status" class="form-control" required style="background-color: #0f172a; color: white;">
                    <option value="Active">Active</option>
                    <option value="Permanent">Permanent</option>
                    <option value="Temporary">Temporary</option>
                    <option value="Separated">Separated</option>
                </select>
            </div>
            <button type="submit" class="btn-submit">Save Employee</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
